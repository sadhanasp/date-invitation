<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f1" />
    <meta name="description" content="Let's plan our date." />
    <title>Let's plan our date</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <div class="stamp" aria-hidden="true">♡</div>
      <p class="eyebrow">Yay, I’m so glad</p>
      <h1>Let’s plan our date.</h1>
      <p class="note">
        Pick whatever sounds nice, or suggest something of your own. We can
        figure out the details together.
      </p>

      <form class="plan-form" id="plan-form">
        <fieldset class="idea-field">
          <legend>What sounds like a fun first date?</legend>
          <div class="idea-options">
            <label class="idea-option">
              <input type="radio" name="idea" value="Coffee or tea and a good conversation" required />
              <span class="idea-card">
                <span class="idea-icon" aria-hidden="true">☕</span>
                <span class="idea-title">Coffee &amp; conversation</span>
                <span class="idea-description">A cozy place to talk</span>
              </span>
            </label>
            <label class="idea-option">
              <input type="radio" name="idea" value="A walk and a chat" />
              <span class="idea-card">
                <span class="idea-icon" aria-hidden="true">🌿</span>
                <span class="idea-title">A walk &amp; a chat</span>
                <span class="idea-description">Somewhere nice outdoors</span>
              </span>
            </label>
            <label class="idea-option">
              <input type="radio" name="idea" value="Dessert together" />
              <span class="idea-card">
                <span class="idea-icon" aria-hidden="true">🍰</span>
                <span class="idea-title">Dessert together</span>
                <span class="idea-description">Something sweet, no rush</span>
              </span>
            </label>
            <label class="idea-option">
              <input type="radio" name="idea" value="Something else" id="custom-idea-choice" />
              <span class="idea-card">
                <span class="idea-icon" aria-hidden="true">✨</span>
                <span class="idea-title">Something else</span>
                <span class="idea-description">You pick the adventure</span>
              </span>
            </label>
          </div>
        </fieldset>
        <div class="field" id="custom-idea-field" hidden>
          <label for="custom-idea">What would you like to do?</label>
          <input
            id="custom-idea"
            name="customIdea"
            type="text"
            placeholder="Your idea..."
            maxlength="120"
          />
        </div>
        <div class="field">
          <label for="date">What day works for you?</label>
          <input id="date" name="date" type="date" required />
        </div>
        <div class="field">
          <label for="time">What time works for you?</label>
          <input id="time" name="time" type="time" required />
        </div>
        <div class="field">
          <label for="place">Any place in mind? <span class="optional">(optional)</span></label>
          <input
            id="place"
            name="place"
            type="text"
            placeholder="A cafe, a park, or somewhere you like"
            maxlength="120"
          />
        </div>
        <button class="button" type="submit">Make my date plan</button>
      </form>

      <p class="response" id="response" role="status" aria-live="polite"></p>
      <a class="button" id="text-plan" href="#" hidden>
        Text this plan to me
      </a>
      <p class="note text-note" id="text-note" hidden>
        Your messaging app will open with the plan ready. Tap Send to share it.
      </p>
      <a class="back-link" href="index.html">← Back to the question</a>
    </main>
    <script>
      const form = document.querySelector("#plan-form");
      const response = document.querySelector("#response");
      const customIdeaChoice = document.querySelector("#custom-idea-choice");
      const customIdeaField = document.querySelector("#custom-idea-field");
      const customIdeaInput = document.querySelector("#custom-idea");
      const textPlan = document.querySelector("#text-plan");
      const textNote = document.querySelector("#text-note");

      form.addEventListener("change", (event) => {
        if (event.target.name !== "idea") {
          return;
        }

        const isCustomIdea = customIdeaChoice.checked;
        customIdeaField.hidden = !isCustomIdea;
        customIdeaInput.required = isCustomIdea;
        if (isCustomIdea) {
          customIdeaInput.focus();
        }
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!form.reportValidity()) {
          return;
        }

        const formData = new FormData(form);
        const dateValue = formData.get("date");
        const date = new Date(`${dateValue}T00:00:00`).toLocaleDateString(
          undefined,
          { dateStyle: "long" },
        );
        const idea = customIdeaChoice.checked
          ? formData.get("customIdea")
          : formData.get("idea");
        const place = formData.get("place");
        const time = formData.get("time");
        const message = [
          "Hi! I’d love to go on a date with you. Here’s my idea:",
          `Date idea: ${idea}`,
          `Day: ${date}`,
          `Time: ${time}`,
          `Place: ${place || "I'm open to suggestions"}`,
          "Let me know what you think! ♡",
        ].join("\n");

        textPlan.href = `sms:0851706921?body=${encodeURIComponent(message)}`;
        textPlan.hidden = false;
        textNote.hidden = false;
        response.textContent =
          "That sounds lovely! Your date plan is ready to text. ♡";
      });
    </script>
  </body>
</html>
